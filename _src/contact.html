<!--
title: Contact — Koyak
description: Send Koyak a message about systems work, compilers, operating systems or open source collaboration.
nav: contact
out: contact.html
-->
<style>
/* Contact: the envelope. The letter mirrors what you type, then folds into the envelope and gets sealed when it sends. */
.c-wrap { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: clamp(30px, 6vw, 90px); align-items: start; padding-block: clamp(24px, 4vw, 56px) 0; }
@media (max-width: 900px) { .c-wrap { grid-template-columns: 1fr; } .env { order: -1; max-width: 460px; } }
.c-wrap .lede { margin: 24px 0 36px; }

form { display: grid; gap: 22px; max-width: 560px; }
.field { display: grid; gap: 8px; }
.field label { font-weight: 600; font-size: 15.5px; }
.field .hint { font: 400 12.5px var(--mono); color: var(--graphite); }
input, textarea { width: 100%; font: 400 17px/1.5 var(--sans); color: var(--ink); background: var(--sheet); border: 1.5px solid var(--ink); border-radius: 10px; padding: 13px 15px; transition: box-shadow .18s ease, border-color .18s ease; }
textarea { min-height: 190px; resize: vertical; }
input:focus, textarea:focus { outline: none; border-color: var(--signal); box-shadow: 0 0 0 3px color-mix(in srgb, var(--signal) 22%, transparent); }
input:user-invalid, textarea:user-invalid { border-color: var(--signal); }
.trap { position: absolute; left: -9999px; width: 1px; height: 1px; opacity: 0; }
.row { display: flex; flex-wrap: wrap; align-items: center; gap: 14px 20px; }
.status { font-size: 15.5px; min-height: 1.5em; }
.status.err { color: var(--signal); }
.elsewhere { margin-top: 44px; padding-top: 22px; border-top: 1.5px solid var(--ink); display: grid; gap: 10px; max-width: 560px; }
.elsewhere div { display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
.elsewhere .mono { color: var(--graphite); }

.env { position: sticky; top: 40px; }
@media (max-width: 900px) { .env { position: static; } }
.env svg { overflow: visible; }
.letter { transform: translateY(calc(var(--sink, 0) * 196px)); transition: transform .7s var(--ease-in-out); }
.flap { transform-box: view-box; transform-origin: 50% 200px; transform: scaleY(-1); opacity: 0; }
.sealed .flap { transform: scaleY(1); opacity: 1; transition: transform .45s var(--ease-in-out) .6s, opacity 0s .6s; }
.backflap { transition: opacity 0s .6s; }
.sealed .backflap { opacity: 0; }
.seal { transform-box: fill-box; transform-origin: center; transform: scale(var(--stamp, 0)) rotate(-14deg); transition: transform .35s var(--ease-out) 1s; }
.ltext { font: 400 13px var(--mono); fill: var(--ink); }
.lsub { font: 600 17px var(--sans); fill: var(--ink); }
</style>

<div class="wrap c-wrap">
  <div>
    <h1 class="display">Write to me.</h1>
    <p class="lede">Questions about a project, an idea for a collaboration, or a role you think I'd fit. The form goes straight to my inbox.</p>
    <form id="form" novalidate>
      <div class="field"><label for="f-email">Your email</label><input id="f-email" name="email" type="email" autocomplete="email" required placeholder="you@example.com"></div>
      <div class="field"><label for="f-subject">Subject</label><input id="f-subject" name="_subject" type="text" maxlength="120" required placeholder="What's it about?"></div>
      <div class="field"><label for="f-message">Message</label><textarea id="f-message" name="message" maxlength="5000" required placeholder="A few lines is plenty."></textarea><span class="hint" id="count">0 / 5000</span></div>
      <input class="trap" type="text" name="_honey" tabindex="-1" autocomplete="off" aria-hidden="true">
      <input type="hidden" name="_template" value="table">
      <input type="hidden" name="_url" value="https://koyak.net/contact.html">
      <div class="row"><button class="btn" id="send" type="submit">Send message</button><span class="status" id="status" role="status" aria-live="polite"></span></div>
    </form>
    <div class="elsewhere">
      <div><span>GitHub</span><a class="mono" href="https://github.com/Kayyo321" rel="me noopener">github.com/Kayyo321</a></div>
      <div><span>Issues on a project</span><span class="mono">open one on its repository</span></div>
    </div>
  </div>

  <div class="env" data-scroll="intro">
    <svg class="art" viewBox="0 0 460 470" id="env" role="img" aria-label="A letter showing your message above an envelope">
      <rect class="cut" x="30" y="200" width="400" height="250" fill="#E7E3DA"/>
      <path class="backflap cut" d="M30 200 L 230 60 L 430 200 Z" fill="var(--ink)"/>
      <clipPath id="env-clip"><rect x="0" y="-300" width="460" height="748"/></clipPath>
      <g clip-path="url(#env-clip)"><g class="letter" id="letter">
        <g class="piece" data-p="0,.6" style="--dy:-80px;--r:-6deg">
          <rect class="cut" x="60" y="20" width="340" height="300" fill="var(--sheet)"/>
          <text class="lsub" id="l-sub" x="84" y="66">Hello</text>
          <text class="ltext" id="l-from" x="84" y="92" fill="var(--graphite)" style="fill: var(--graphite)">from you@example.com</text>
          <g id="l-lines"></g>
        </g>
      </g></g>
      <path class="cut" d="M30 200 L 230 330 L 430 200 L 430 450 L 30 450 Z" fill="var(--sheet)"/>
      <path d="M30 450 L 200 310 M430 450 L 260 310" stroke="var(--rule)" stroke-width="1.5" fill="none"/>
      <path class="flap cut" id="flap" d="M30 200 L 230 340 L 430 200 Z" fill="var(--ink)"/>
      <g class="seal" id="seal"><circle class="cut" cx="230" cy="330" r="34" fill="var(--signal)"/><text x="230" y="343" text-anchor="middle" style="font: 700 36px var(--sans); fill: #fff">K</text></g>
      <text x="300" y="430" style="font: 400 13px var(--mono); fill: var(--graphite)">to koyak.net</text>
    </svg>
  </div>
</div>

<script>
(() => {
  const form = document.getElementById('form'), send = document.getElementById('send'), status = document.getElementById('status');
  const env = document.getElementById('env'), lines = document.getElementById('l-lines');
  const sub = document.getElementById('l-sub'), from = document.getElementById('l-from');
  const email = document.getElementById('f-email'), subject = document.getElementById('f-subject'), message = document.getElementById('f-message'), count = document.getElementById('count');
  const flap = document.getElementById('flap'), seal = document.getElementById('seal'), letter = document.getElementById('letter');

  // the letter mirrors what's typed, wrapped to the sheet
  const wrap = (text, n) => { const out = []; for (const para of text.split('\n')) { let line = ''; for (const w of para.split(/\s+/)) { if ((line + ' ' + w).trim().length > n) { out.push(line); line = w; } else line = (line + ' ' + w).trim(); } out.push(line); } return out; };
  function mirror() {
    sub.textContent = (subject.value.trim() || 'Hello').slice(0, 28) + (subject.value.length > 28 ? '…' : '');
    from.textContent = 'from ' + (email.value.trim() || 'you@example.com').slice(0, 34);
    const ls = message.value.trim() ? wrap(message.value, 36).slice(0, 9) : [];
    lines.innerHTML = '';
    for (let i = 0; i < 9; i++) {
      const y = 132 + i * 20;
      if (ls[i] !== undefined && ls[i] !== '') { const t = document.createElementNS(Paper.NS, 'text'); t.setAttribute('class', 'ltext'); t.setAttribute('x', 84); t.setAttribute('y', y); t.textContent = ls[i]; lines.appendChild(t); }
      else if (!ls.length) { const r = document.createElementNS(Paper.NS, 'rect'); r.setAttribute('x', 84); r.setAttribute('y', y - 9); r.setAttribute('width', [250, 210, 270, 180, 240, 120, 0, 0, 0][i]); r.setAttribute('height', 5); r.setAttribute('fill', 'var(--rule)'); lines.appendChild(r); }
    }
    count.textContent = `${message.value.length} / 5000`;
  }
  [email, subject, message].forEach((el) => el.addEventListener('input', () => { mirror(); if (status.classList.contains('err')) { status.className = 'status'; status.textContent = ''; } }));
  mirror();

  Paper.ink(env, Paper.scrawl(298, 442, 110, 5, 2), [.6, 1], { color: 'var(--signal)', width: 2.2 });

  const seal_ = (on) => { env.classList.toggle('sealed', on); letter.style.setProperty('--sink', on ? 1 : 0); seal.style.setProperty('--stamp', on ? 1 : 0); };

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    status.className = 'status'; status.textContent = '';
    if (!form.checkValidity()) {
      const bad = form.querySelector(':invalid');
      status.className = 'status err';
      status.textContent = bad === email ? 'Add an email address I can reply to.' : bad === subject ? 'Add a subject.' : 'Write a message first.';
      bad.focus(); return;
    }
    send.disabled = true; send.textContent = 'Sending…';
    try {
      const res = await fetch('https://formsubmit.co/ajax/c42d371e5f8bd75a0d70b9650bb87234', { method: 'POST', headers: { Accept: 'application/json' }, body: new URLSearchParams(new FormData(form)) });
      const out = await res.json().catch(() => ({}));
      if (!res.ok || out.success === false || out.success === 'false') throw new Error(out.message || res.status);
      seal_(true);
      status.textContent = `Sent. I'll reply to ${email.value.trim()}.`;
      send.textContent = 'Sent';
      setTimeout(() => { form.reset(); mirror(); }, 900);
      setTimeout(() => { seal_(false); send.textContent = 'Send another'; send.disabled = false; }, 4200);
    } catch (err) {
      status.className = 'status err';
      status.textContent = /(^|\.)koyak\.net$/i.test(location.hostname)
        ? "Couldn't send. Check your connection and try again."
        : 'Sending only works on koyak.net. This preview is on another address.';
      send.disabled = false; send.textContent = 'Send message';
    }
  });
})();
</script>
