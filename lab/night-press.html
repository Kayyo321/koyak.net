<!DOCTYPE html>
<!--
    THIS IS A TEMPLATE THAT SHOULD BE USED EVERY TIME AND MODIFIED.
    WHAT TO KEEP:
    ✓ Overall structure (header, sidebar, main content)
    ✓ Anthropic branding (colors, fonts, layout)
    ✓ Seed navigation section (always include this)
    ✓ Self-contained artifact (everything inline)

    WHAT TO CREATIVELY EDIT:
    ✗ The p5.js algorithm (implement YOUR vision)
    ✗ The parameters (define what YOUR art needs)
    ✗ The UI controls (match YOUR parameters)

    Let your philosophy guide the implementation.
    The world is your oyster - be creative!
-->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Night Press lab</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.7.0/p5.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&family=Lora:wght@400;500&display=swap" rel="stylesheet">
    <style>
        /* Anthropic Brand Colors */
        :root {
            --anthropic-dark: #141413;
            --anthropic-light: #faf9f5;
            --anthropic-mid-gray: #b0aea5;
            --anthropic-light-gray: #e8e6dc;
            --anthropic-orange: #d97757;
            --anthropic-blue: #6a9bcc;
            --anthropic-green: #788c5d;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, var(--anthropic-light) 0%, #f5f3ee 100%);
            min-height: 100vh;
            color: var(--anthropic-dark);
        }

        .container {
            display: flex;
            min-height: 100vh;
            padding: 20px;
            gap: 20px;
        }

        /* Sidebar */
        .sidebar {
            width: 320px;
            flex-shrink: 0;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(20, 20, 19, 0.1);
            overflow-y: auto;
            overflow-x: hidden;
        }

        .sidebar h1 {
            font-family: 'Lora', serif;
            font-size: 24px;
            font-weight: 500;
            color: var(--anthropic-dark);
            margin-bottom: 8px;
        }

        .sidebar .subtitle {
            color: var(--anthropic-mid-gray);
            font-size: 14px;
            margin-bottom: 32px;
            line-height: 1.4;
        }

        /* Control Sections */
        .control-section {
            margin-bottom: 32px;
        }

        .control-section h3 {
            font-size: 16px;
            font-weight: 600;
            color: var(--anthropic-dark);
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .control-section h3::before {
            content: '•';
            color: var(--anthropic-orange);
            font-weight: bold;
        }

        /* Seed Controls */
        .seed-input {
            width: 100%;
            background: var(--anthropic-light);
            padding: 12px;
            border-radius: 8px;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            margin-bottom: 12px;
            border: 1px solid var(--anthropic-light-gray);
            text-align: center;
        }

        .seed-input:focus {
            outline: none;
            border-color: var(--anthropic-orange);
            box-shadow: 0 0 0 2px rgba(217, 119, 87, 0.1);
            background: white;
        }

        .seed-controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-bottom: 8px;
        }

        .regen-button {
            margin-bottom: 0;
        }

        /* Parameter Controls */
        .control-group {
            margin-bottom: 20px;
        }

        .control-group label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            color: var(--anthropic-dark);
            margin-bottom: 8px;
        }

        .slider-container {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .slider-container input[type="range"] {
            flex: 1;
            height: 4px;
            background: var(--anthropic-light-gray);
            border-radius: 2px;
            outline: none;
            -webkit-appearance: none;
        }

        .slider-container input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 16px;
            height: 16px;
            background: var(--anthropic-orange);
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .slider-container input[type="range"]::-webkit-slider-thumb:hover {
            transform: scale(1.1);
            background: #c86641;
        }

        .slider-container input[type="range"]::-moz-range-thumb {
            width: 16px;
            height: 16px;
            background: var(--anthropic-orange);
            border-radius: 50%;
            border: none;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .value-display {
            font-family: 'Courier New', monospace;
            font-size: 12px;
            color: var(--anthropic-mid-gray);
            min-width: 60px;
            text-align: right;
        }

        /* Color Pickers */
        .color-group {
            margin-bottom: 16px;
        }

        .color-group label {
            display: block;
            font-size: 12px;
            color: var(--anthropic-mid-gray);
            margin-bottom: 4px;
        }

        .color-picker-container {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .color-picker-container input[type="color"] {
            width: 32px;
            height: 32px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            background: none;
            padding: 0;
        }

        .color-value {
            font-family: 'Courier New', monospace;
            font-size: 12px;
            color: var(--anthropic-mid-gray);
        }

        /* Buttons */
        .button {
            background: var(--anthropic-orange);
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            width: 100%;
        }

        .button:hover {
            background: #c86641;
            transform: translateY(-1px);
        }

        .button:active {
            transform: translateY(0);
        }

        .button.secondary {
            background: var(--anthropic-blue);
        }

        .button.secondary:hover {
            background: #5a8bb8;
        }

        .button.tertiary {
            background: var(--anthropic-green);
        }

        .button.tertiary:hover {
            background: #6b7b52;
        }

        .button-row {
            display: flex;
            gap: 8px;
        }

        .button-row .button {
            flex: 1;
        }

        /* Canvas Area */
        .canvas-area {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            min-width: 0;
        }

        #canvas-container {
            width: 100%;
            max-width: 1000px;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 20px 40px rgba(20, 20, 19, 0.1);
            background: white;
        }

        #canvas-container canvas {
            display: block;
            width: 100% !important;
            height: auto !important;
        }

        /* Loading State */
        .loading {
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            color: var(--anthropic-mid-gray);
        }

        /* Responsive - Stack on mobile */
        @media (max-width: 600px) {
            .container {
                flex-direction: column;
            }

            .sidebar {
                width: 100%;
            }

            .canvas-area {
                padding: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Control Sidebar -->
        <div class="sidebar">
            <!-- Headers (CUSTOMIZE THIS FOR YOUR ART) -->
            <h1>Night Press</h1>
            <div class="subtitle">Seeded halftone, tone thresholds and offset crops on the mascot plate. Lab prototype; tune here, port to GLSL.</div>

            <!-- Seed Section (ALWAYS KEEP THIS) -->
            <div class="control-section">
                <h3>Seed</h3>
                <input type="number" id="seed-input" class="seed-input" value="12345" onchange="updateSeed()">
                <div class="seed-controls">
                    <button class="button secondary" onclick="previousSeed()">← Prev</button>
                    <button class="button secondary" onclick="nextSeed()">Next →</button>
                </div>
                <button class="button tertiary regen-button" onclick="randomSeedAndUpdate()">↻ Random</button>
            </div>

            <!-- Parameters Section (CUSTOMIZE THIS FOR YOUR ART) -->
            <div class="control-section">
                <h3>Parameters</h3>
                

                <div class="control-group">
                    <label>Dot pitch (px)</label>
                    <div class="slider-container">
                        <input type="range" id="pitch" min="4" max="24" step="1" value="9" oninput="updateParam('pitch', this.value)">
                        <span class="value-display" id="pitch-value">9</span>
                    </div>
                </div>
                <div class="control-group">
                    <label>Screen angle (deg)</label>
                    <div class="slider-container">
                        <input type="range" id="angle" min="0" max="90" step="1" value="22" oninput="updateParam('angle', this.value)">
                        <span class="value-display" id="angle-value">22</span>
                    </div>
                </div>
                <div class="control-group">
                    <label>Tone gamma</label>
                    <div class="slider-container">
                        <input type="range" id="gamma" min="0.4" max="2.5" step="0.05" value="1.15" oninput="updateParam('gamma', this.value)">
                        <span class="value-display" id="gamma-value">1.15</span>
                    </div>
                </div>
                <div class="control-group">
                    <label>Tone levels</label>
                    <div class="slider-container">
                        <input type="range" id="levels" min="2" max="16" step="1" value="7" oninput="updateParam('levels', this.value)">
                        <span class="value-display" id="levels-value">7</span>
                    </div>
                </div>
                <div class="control-group">
                    <label>Misregistration</label>
                    <div class="slider-container">
                        <input type="range" id="jitter" min="0" max="1" step="0.05" value="0.25" oninput="updateParam('jitter', this.value)">
                        <span class="value-display" id="jitter-value">0.25</span>
                    </div>
                </div>
                <div class="control-group">
                    <label>Offset crops</label>
                    <div class="slider-container">
                        <input type="range" id="slices" min="0" max="16" step="1" value="7" oninput="updateParam('slices', this.value)">
                        <span class="value-display" id="slices-value">7</span>
                    </div>
                </div>
                <div class="control-group">
                    <label>Crop shift (px)</label>
                    <div class="slider-container">
                        <input type="range" id="shift" min="0" max="60" step="1" value="18" oninput="updateParam('shift', this.value)">
                        <span class="value-display" id="shift-value">18</span>
                    </div>
                </div>
            </div>

            <!-- Colors Section (OPTIONAL - CUSTOMIZE OR REMOVE) -->
            <div class="control-section">
                <h3>Colors</h3>
                
                <div class="color-group">
                    <label>Ink (shadow dots)</label>
                    <div class="color-picker-container">
                        <input type="color" id="color1" value="#3b42d6" onchange="updateColor('color1', this.value)">
                        <span class="color-value" id="color1-value">#3b42d6</span>
                    </div>
                </div>
                <div class="color-group">
                    <label>Paper (light dots)</label>
                    <div class="color-picker-container">
                        <input type="color" id="color2" value="#eceeff" onchange="updateColor('color2', this.value)">
                        <span class="color-value" id="color2-value">#eceeff</span>
                    </div>
                </div>
                <div class="color-group">
                    <label>Ground</label>
                    <div class="color-picker-container">
                        <input type="color" id="color3" value="#070936" onchange="updateColor('color3', this.value)">
                        <span class="color-value" id="color3-value">#070936</span>
                    </div>
                </div>
            </div>

            <!-- Actions Section (ALWAYS KEEP THIS) -->
            <div class="control-section">
                <h3>Actions</h3>
                <div class="button-row">
                    <button class="button" onclick="resetParameters()">Reset</button>
                    <button class="button secondary" onclick="saveCanvas('night-press-'+params.seed,'png')">Download PNG</button>
                </div>
            </div>
        </div>

        <!-- Main Canvas Area -->
        <div class="canvas-area">
            <div id="canvas-container">
                <div class="loading">Initializing generative art...</div>
            </div>
        </div>
    </div>

    <script>
        // ═══════════════════════════════════════════════════════════════════════
        // GENERATIVE ART PARAMETERS - CUSTOMIZE FOR YOUR ALGORITHM
        // ═══════════════════════════════════════════════════════════════════════

        let params = {
            seed: 12345,
            pitch: 9, angle: 22, gamma: 1.15, levels: 7,
            jitter: 0.25, slices: 7, shift: 18,
            colorPalette: ['#3b42d6', '#eceeff', '#070936']
        };
        let defaultParams = {...params, colorPalette: [...params.colorPalette]};

        // ═══════════════════════════════════════════════════════════════════════
        // NIGHT PRESS — rotated AM halftone, posterized tone, seeded crops
        // ═══════════════════════════════════════════════════════════════════════
        let src, lum, W = 1200;

        function preload() { src = loadImage('mascot.png'); }

        function setup() {
            let canvas = createCanvas(W, W);
            canvas.parent('canvas-container');
            pixelDensity(1);
            src.resize(W, W); src.loadPixels();
            lum = new Float32Array(W * W);
            for (let i = 0; i < W * W; i++) {
                lum[i] = (0.2126*src.pixels[i*4] + 0.7152*src.pixels[i*4+1] + 0.0722*src.pixels[i*4+2]) / 255;
            }
            noLoop();
            initializeSystem();
            document.querySelector('.loading').style.display = 'none';
        }

        // deterministic per-cell hash (same seed => same plate)
        function hash(x, y, s) {
            let h = Math.imul(x | 0, 374761393) ^ Math.imul(y | 0, 668265263) ^ Math.imul(s | 0, 2246822519);
            h = Math.imul(h ^ (h >>> 13), 1274126177);
            return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
        }

        function tone(x, y) {
            x = constrain(x | 0, 0, W - 1); y = constrain(y | 0, 0, W - 1);
            let t = pow(lum[y * W + x], params.gamma);
            return round(t * (params.levels - 1)) / (params.levels - 1); // posterize
        }

        function press(pitch, ang, ox, oy, salt) {
            const a = radians(ang), ca = cos(a), sa = sin(a);
            const ink = color(params.colorPalette[0]), paper = color(params.colorPalette[1]);
            const n = ceil(W * 1.5 / pitch);
            noStroke();
            for (let j = -n; j <= n; j++) for (let i = -n; i <= n; i++) {
                const u = i * pitch, v = j * pitch;
                const jx = (hash(i, j, params.seed + salt) - .5) * pitch * params.jitter;
                const jy = (hash(j, i, params.seed + salt + 7) - .5) * pitch * params.jitter;
                const x = W/2 + u*ca - v*sa + jx, y = W/2 + u*sa + v*ca + jy;
                if (x < -pitch || y < -pitch || x > W + pitch || y > W + pitch) continue;
                const t = tone(x - ox, y - oy);
                if (t < 0.04 && hash(i, j, params.seed + 99) < 0.85) continue; // shadow dropout
                const r = pitch * 0.5 * sqrt(t) * 1.42 * (0.92 + 0.16 * hash(i, j, params.seed + 3));
                fill(lerpColor(ink, paper, smoothstep(0.25, 0.85, t)));
                circle(x, y, r * 2);
            }
        }
        function smoothstep(a, b, x) { x = constrain((x - a) / (b - a), 0, 1); return x * x * (3 - 2 * x); }

        function initializeSystem() { redraw(); }

        function draw() {
            randomSeed(params.seed); noiseSeed(params.seed);
            background(params.colorPalette[2]);
            press(params.pitch, params.angle, 0, 0, 0);
            // offset crops: re-press under seeded rectangles at a different pitch
            for (let k = 0; k < params.slices; k++) {
                const w = random(60, 340), h = random(24, 260);
                const x = random(W * 0.15, W * 0.85 - w), y = random(W * 0.1, W * 0.9 - h);
                const ctx = drawingContext; ctx.save();
                ctx.beginPath(); ctx.rect(x, y, w, h); ctx.clip();
                fill(params.colorPalette[2]); rect(x, y, w, h);
                const p = params.pitch * random([0.55, 0.7, 1.4, 1.8]);
                press(p, params.angle + random([-15, 0, 23, 45]), random(-1,1)*params.shift, random(-1,1)*params.shift*0.3, k + 11);
                ctx.restore();
            }
        }

        function updateParam(name, value) {
            params[name] = parseFloat(value);
            document.getElementById(name + '-value').textContent = value;
            redraw();
        }
        function updateColor(id, value) {
            params.colorPalette[{color1:0,color2:1,color3:2}[id]] = value;
            document.getElementById(id + '-value').textContent = value;
            redraw();
        }

        // ═══════════════════════════════════════════════════════════════════════
        // SEED CONTROL FUNCTIONS - ALWAYS KEEP THESE
        // ═══════════════════════════════════════════════════════════════════════

        function updateSeedDisplay() {
            document.getElementById('seed-input').value = params.seed;
        }

        function updateSeed() {
            let input = document.getElementById('seed-input');
            let newSeed = parseInt(input.value);
            if (newSeed && newSeed > 0) {
                params.seed = newSeed;
                initializeSystem();
            } else {
                // Reset to current seed if invalid
                updateSeedDisplay();
            }
        }

        function previousSeed() {
            params.seed = Math.max(1, params.seed - 1);
            updateSeedDisplay();
            initializeSystem();
        }

        function nextSeed() {
            params.seed = params.seed + 1;
            updateSeedDisplay();
            initializeSystem();
        }

        function randomSeedAndUpdate() {
            params.seed = Math.floor(Math.random() * 999999) + 1;
            updateSeedDisplay();
            initializeSystem();
        }

        function resetParameters() {
            params = {...defaultParams, colorPalette: [...defaultParams.colorPalette]};
            
            for (const k of ['pitch','angle','gamma','levels','jitter','slices','shift']) {
                document.getElementById(k).value = params[k];
                document.getElementById(k+'-value').textContent = params[k];
            }
            ['color1','color2','color3'].forEach((c,i)=>{ document.getElementById(c).value = params.colorPalette[i]; document.getElementById(c+'-value').textContent = params.colorPalette[i]; });
            
            updateSeedDisplay();
            initializeSystem();
        }

        // Initialize UI on load
        window.addEventListener('load', function() {
            updateSeedDisplay();
        });
    </script>
</body>
</html>
