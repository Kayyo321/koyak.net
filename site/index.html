<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>koyak.net</title>
  <meta name="theme-color" content="#070936">
  <link rel="preload" href="fonts/BigShoulders-Bold.ttf" as="font" type="font/ttf" crossorigin>
  <link rel="preload" href="fonts/IBMPlexMono-Regular.ttf" as="font" type="font/ttf" crossorigin>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="stage">
    <div class="masthead">
    <div class="title">
    <h1 class="mark" aria-label="koyak.net">
      <span class="koyak" id="koyak" aria-hidden="true">koyak<canvas id="koyak-canvas"></canvas></span><span class="net" aria-hidden="true">.net</span>
    </h1>

    <nav class="cards" aria-label="Find koyak">
      <a class="card" href="https://github.com/Kayyo321" target="_blank" rel="noopener noreferrer" aria-label="GitHub, Kayyo321">
        <svg class="ico" viewBox="0 0 16 16" aria-hidden="true"><path fill="currentColor" d="M8 0c4.42 0 8 3.58 8 8a8.013 8.013 0 0 1-5.45 7.59c-.4.08-.55-.17-.55-.38 0-.27.01-1.13.01-2.2 0-.75-.25-1.23-.54-1.48 1.78-.2 3.65-.88 3.65-3.95 0-.88-.31-1.59-.82-2.15.08-.2.36-1.02-.08-2.12 0 0-.67-.22-2.2.82-.64-.18-1.32-.27-2-.27-.68 0-1.36.09-2 .27-1.53-1.03-2.2-.82-2.2-.82-.44 1.1-.16 1.92-.08 2.12-.51.56-.82 1.28-.82 2.15 0 3.06 1.86 3.75 3.64 3.95-.23.2-.44.55-.51 1.07-.46.21-1.61.55-2.33-.66-.15-.24-.6-.83-1.23-.82-.67.01-.27.38.01.53.34.19.73.9.82 1.13.16.45.68 1.31 2.69.94 0 .67.01 1.3.01 1.49 0 .21-.15.45-.55.38A7.995 7.995 0 0 1 0 8c0-4.42 3.58-8 8-8Z"/></svg>
      </a>
      <a class="card" href="https://x.com/koyyaakk" target="_blank" rel="noopener noreferrer" aria-label="X, @koyyaakk">
        <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>
      </a>
      <button class="card" id="copy-email" type="button" data-email="s@koyak.net" aria-label="Copy email address s@koyak.net">
        <svg class="ico ico-mail" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="5" width="19" height="14" rx="1.5"/><path d="m3 6.5 9 6.5 9-6.5"/></svg>
        <svg class="ico ico-check" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 12.5l5 5 10-11"/></svg>
        <span class="sr-only" role="status" id="copy-status"></span>
      </button>
    </nav>
    </div>

    <!-- She still gets the first word wrong sometimes. -->
    <figure class="writer" id="writer" data-margin="She still gets the first word wrong sometimes.">
      <canvas id="writer-canvas" role="img" aria-label="A typewriter. The sheet is blank. Type to write on it."></canvas>
      <textarea id="writer-input" class="writer-input" aria-label="Type on the typewriter" autocapitalize="off" autocomplete="off" autocorrect="off" spellcheck="false"></textarea>
      <button class="send is-empty" id="writer-send" type="button" aria-label="Send what you typed to koyak.net" title="send" disabled>
        <canvas class="plane" aria-hidden="true"></canvas>
        <img class="plane-img" src="assets/plane.png" alt="" hidden>
      </button>
      <button class="mute" id="mute" type="button" aria-pressed="false" aria-label="Sound is on. Mute sound" title="sound on">
        <svg class="px px-on" viewBox="0 0 11 9" aria-hidden="true" shape-rendering="crispEdges"><path fill="currentColor" d="M0 3h2v3H0zM2 2h1v5H2zM3 1h1v7H3zM4 0h1v9H4zM6 3h1v3H6zM7 1h1v2H7zM7 6h1v2H7zM8 3h1v3H8zM9 0h1v1H9zM9 8h1v1H9zM10 2h1v5h-1z"/></svg>
        <svg class="px px-off" viewBox="0 0 11 9" aria-hidden="true" shape-rendering="crispEdges"><path fill="currentColor" d="M0 3h2v3H0zM2 2h1v5H2zM3 1h1v7H3zM4 0h1v9H4zM6 2h1v1H6zM10 2h1v1h-1zM7 3h1v1H7zM9 3h1v1H9zM8 4h1v1H8zM7 5h1v1H7zM9 5h1v1H9zM6 6h1v1H6zM10 6h1v1h-1z"/></svg>
      </button>
      <p class="sr-only" id="writer-status" aria-live="polite"></p>
    </figure>
    </div>

    <figure class="plate" id="plate">
      <canvas id="plate-canvas" role="img" aria-label="The koyak mascot: a halftone portrait in two profiles, printed in ultramarine dots inside a ring of registration marks."></canvas>
      <img class="plate-fallback" src="assets/plate-fallback.png" alt="The koyak mascot: a halftone portrait in two profiles, printed in ultramarine dots." hidden>
    </figure>
  </main>

  <footer class="underside" id="underside" aria-label="Under the page" data-margin="Paper tends to catch on the underside." hidden>
    <!-- Paper tends to catch on the underside. -->
    <div class="shelf" role="list"></div>
  </footer>

  <div class="fx" id="fx" aria-hidden="true"><div class="fx-dim"></div></div>

  <div class="sheet-room" id="sheet-room" role="dialog" aria-modal="true" aria-label="An unfolded paper plane" data-own-keys hidden>
    <div class="lamp" aria-hidden="true"></div>
    <div class="sheet" tabindex="0" role="button" aria-pressed="false" aria-label="The sheet. Press to hold it up to the light" aria-describedby="sheet-status">
      <div class="face face-front"></div>
      <div class="face face-back"></div>
      <div class="face face-light"></div>
      <button class="corner" type="button" aria-label="Turn the sheet over"><span aria-hidden="true"></span></button>
    </div>
    <button class="fold-up" type="button" aria-label="Fold it back up"><span aria-hidden="true"></span></button>
    <p class="sr-only sheet-status" id="sheet-status" aria-live="polite"></p>
  </div>

  <script src="ripple.js"></script>
  <script src="sound.js"></script>
  <script src="plate.js"></script>
  <script src="koyak.js"></script>
  <script src="typewriter.js"></script>
  <script src="plane.js"></script>
  <script src="cards.js"></script>
  <script src="cardsprint.js"></script>
  <script src="underside.js"></script>
</body>
</html>
